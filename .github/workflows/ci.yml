name: "CI"
permissions:
  statuses: write
  contents: write
  id-token: write
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}-${{ github.event.ref }}
  cancel-in-progress: true
on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"
env:
  ALLOW_PLOTTING: "true"

jobs:
  pip-pre:
    name: ${{ matrix.os }} / Python${{ matrix.python-version }} / ${{ matrix.qt }} / pyvista-main / qtpy-master
    runs-on: ${{ matrix.os}}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        qt: ["PySide6", "PyQt6"]
        python-version: ["3.14"]
        os: ["ubuntu-latest"]
        include:
          - qt: "PySide6"
            python-version: "3.14"
            os: "macos-latest"
    defaults:
      run:
        shell: bash -e {0}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pyvista/setup-headless-display-action@main
        with:
          qt: true
          pyvista: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m pip install --upgrade pip wheel
          pip install --upgrade -e ".[test]" "${{ matrix.qt }}" --only-binary="${{ matrix.qt }}" https://github.com/pyvista/pyvista/zipball/main https://github.com/spyder-ide/qtpy/zipball/master trame-pyvista
        name: "Install dependencies with pip"
      - run: |
          python -c "import pyvista; print(pyvista.Report())"
        name: "Check report"
      - run: python pyvistaqt/rwi.py
        name: "Run QVTKRenderWidgetConeExample"
      - run: pytest -v --cov pyvistaqt --cov-report html
        name: "Run Tests"
      - uses: codecov/codecov-action@v7
        if: success()
        name: "Upload coverage to CodeCov"
        with:
          use_oidc: true

  pip:
    name: ${{ matrix.os }} / pip / ${{ matrix.qt }} / pyvista-${{ matrix.pyvista }}${{ matrix.vtk && ' / vtk'}}${{ matrix.vtk }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Default: latest PyVista + latest VTK on every supported OS
        os:
          ["ubuntu-latest", "macos-15-intel", "macos-latest", "windows-latest"]
        pyvista: ["0"]
        python-version: ["3.14"]
        vtk: [""]
        qt: ["PyQt6"]
        include:
          # Regression coverage across supported Python, PyVista, and VTK
          # versions. Each entry targets a distinct combination; Qt bindings
          # rotate so PyQt6/PySide6 each see a released PyVista.
          - os: "ubuntu-latest"
            pyvista: "0.43"
            python-version: "3.10"
            vtk: "==9.2.5"
            qt: "PyQt6"
          - os: "ubuntu-latest"
            pyvista: "0.44"
            python-version: "3.11"
            vtk: "==9.3.1"
            qt: "PyQt6"
          - os: "ubuntu-latest"
            pyvista: "0.45"
            python-version: "3.12"
            vtk: "==9.4.2"
            qt: "PyQt6"
          - os: "ubuntu-latest"
            pyvista: "0.46"
            python-version: "3.13"
            vtk: "==9.5.2"
            qt: "PySide6"
          - os: "ubuntu-latest"
            pyvista: "0.47"
            python-version: "3.13"
            vtk: "==9.5.2"
            qt: "PySide6"
          - os: "ubuntu-latest"
            pyvista: "0.48"
            python-version: "3.14"
            vtk: "==9.6.1"
            qt: "PySide6"

    defaults:
      run:
        shell: bash -e {0}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pyvista/setup-headless-display-action@main
        with:
          qt: true
          pyvista: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m pip install --upgrade pip wheel
          pip install -e ".[test]"  "pyvista==${{ matrix.pyvista }}.*" "vtk${{ matrix.vtk }}" "${{ matrix.qt }}" --only-binary="vtk,{{ matrix.qt }},pyvista"
        name: "Install dependencies with pip"
      - run: |
          pip install "numpy<2"
        if: matrix.pyvista == '0.43'
        name: "Install old NumPy"
      - run: |
          python -c "import pyvista; print(pyvista.Report())"
        name: "Check report"
      - run: pytest -v --cov=pyvistaqt --cov-report=html -m "not slow" tests/
        name: "Run most tests" # the slow tests are *really* slow on Intel sometimes
        if: matrix.os == 'macos-15-intel'
      - run: pytest -v --cov=pyvistaqt --cov-report=html tests/
        name: "Run all tests"
        if: matrix.os != 'macos-15-intel'
      - uses: codecov/codecov-action@v7
        if: success()
        name: "Upload coverage to CodeCov"
        with:
          use_oidc: true

  conda:
    name: ${{ matrix.os }} / conda / ${{ matrix.qt }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os:
          ["ubuntu-latest", "macos-15-intel", "macos-latest", "windows-latest"]
        qt: ["PySide6"]
        python-version: ["3.12"]
    defaults:
      run:
        shell: bash -el {0}
    env:
      ALLOW_PLOTTING: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pyvista/setup-headless-display-action@main
        with:
          qt: true
          pyvista: false
      - uses: mamba-org/setup-micromamba@v3
        with:
          # https://github.com/mamba-org/setup-micromamba/issues/225
          micromamba-version: 1.5.10-0
          environment-file: "environment.yml"
          environment-name: "pyvistaqt-env"
          create-args: >-
            python=${{ matrix.python-version }} ${{ matrix.qt }}
      - run: |
          pip install -e .
          python -c "import pyvista; print(pyvista.Report())"
        name: "Install pyvistaqt and check report"
      - run: pytest -v --cov pyvistaqt --cov-report html
        name: "Run Tests"
      - uses: codecov/codecov-action@v7
        if: success()
        name: "Upload coverage to CodeCov"
        with:
          use_oidc: true

  wayland:
    # #445: pyvistaqt did not work on Wayland, and the docs told Wayland users
    # to force QT_QPA_PLATFORM=xcb. The QOpenGLWidget rewrite is supposed to
    # remove that caveat, which is only a claim until something tests it -- no
    # other job here runs a Wayland compositor, they all run xcb under Xvfb.
    name: ubuntu-latest / wayland / ${{ matrix.qt }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        qt: ["PyQt6", "PySide6"]
        python-version: ["3.13"]
    defaults:
      run:
        shell: bash -e {0}
    env:
      QT_QPA_PLATFORM: "wayland"
      WAYLAND_DISPLAY: "wayland-ci"
      XDG_RUNTIME_DIR: "/tmp/xdg-runtime-dir"
      # llvmpipe: the runners have no GPU, and the Wayland EGL path cannot fall
      # back to OSMesa the way the Xvfb jobs do.
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: "llvmpipe"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: "Install Weston and the Wayland/EGL runtime"
        run: |
          opts=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
            -o DPkg::Lock::Timeout=120
            -o Dpkg::Options::=--force-unsafe-io
          )
          sudo timeout 5m apt-get update "${opts[@]}"
          sudo DEBIAN_FRONTEND=noninteractive timeout 10m apt-get install -y "${opts[@]}" \
            weston \
            libegl1 \
            libgl1-mesa-dri \
            libgles2 \
            libopengl0 \
            libwayland-egl1 \
            libdbus-1-3 \
            libpulse0 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libnss3 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libxtst6
          weston --version

      - name: "Start a headless Weston compositor"
        run: |
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          # Two things vary across Weston releases and both matter here:
          #   * Weston 14 renamed the backend "headless-backend.so" -> "headless".
          #   * The headless backend defaults to the pixman (software) renderer,
          #     which advertises neither wl_drm nor linux-dmabuf, so a client
          #     asking Mesa for an EGL context on the Wayland platform gets
          #     nothing and QOpenGLWidget has no GL to render into. --renderer=gl
          #     runs the compositor on surfaceless EGL and does advertise them.
          # Try the combinations most-capable first and report which one took.
          for args in \
            "--backend=headless --renderer=gl" \
            "--backend=headless-backend.so --renderer=gl" \
            "--backend=headless" \
            "--backend=headless-backend.so"; do
            echo "Trying weston $args"
            # shellcheck disable=SC2086
            nohup weston $args --socket="$WAYLAND_DISPLAY" \
              --width=1920 --height=1080 --idle-time=0 >weston.log 2>&1 &
            for _ in $(seq 1 50); do
              if [ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]; then
                echo "Compositor socket is up (weston $args)"
                echo "WESTON_ARGS=$args" >> "$GITHUB_ENV"
                exit 0
              fi
              sleep 0.2
            done
            echo "--- weston.log for: $args ---"
            cat weston.log || true
          done
          echo "Weston never created $XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" >&2
          exit 1

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: "Install dependencies with pip"
        run: |
          python -m pip install --upgrade pip wheel
          pip install -e ".[test]" "${{ matrix.qt }}" --only-binary="${{ matrix.qt }}"

      - name: "Confirm Qt is really on Wayland"
        run: python .github/scripts/assert_wayland.py

      - name: "Check report"
        run: python -c "import pyvista; print(pyvista.Report())"

      - name: "Run QVTKRenderWidgetConeExample"
        run: python pyvistaqt/rwi.py

      - name: "Run Tests"
        run: pytest -v --cov=pyvistaqt --cov-report=html tests/

      - name: "Weston log"
        if: always()
        run: cat weston.log || true

      - uses: codecov/codecov-action@v7
        if: success()
        name: "Upload coverage to CodeCov"
        with:
          use_oidc: true
